<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" fill="none">
  <defs>
    <style>
      @keyframes pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.25; } }
      @keyframes lensPulse { 0%, 100% { opacity: 0; stroke-width: 1px; } 50% { opacity: 0.4; stroke-width: 3px; } }
      @keyframes scanLine { 0% { transform: translateY(-60px); opacity: 0; } 50% { opacity: 0.6; } 100% { transform: translateY(60px); opacity: 0; } }
      @keyframes checkPop { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 1; } }
      @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(700px, 140px); } }
      @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-500px, -120px); } }
      @keyframes drift3 { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(-300px, -50px); } 66% { transform: translate(400px, 50px); } }
      @keyframes lineFlow { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
      .lens-body { animation: pulse 3s ease-in-out infinite; }
      .lens-ring { animation: lensPulse 3s ease-in-out infinite; }
      .scan { animation: scanLine 2.5s ease-in-out infinite; }
      .c1 { animation: checkPop 2.4s ease-in-out infinite; transform-origin: 710px 55px; }
      .c2 { animation: checkPop 2.4s ease-in-out 0.6s infinite; transform-origin: 710px 85px; }
      .c3 { animation: checkPop 2.4s ease-in-out 1.2s infinite; transform-origin: 710px 115px; }
      .c4 { animation: checkPop 2.4s ease-in-out 1.8s infinite; transform-origin: 710px 145px; }
      .p1 { animation: drift1 12s linear infinite; }
      .p2 { animation: drift2 10s linear infinite; }
      .p3 { animation: drift3 16s linear infinite; }
      .code-line { animation: lineFlow 1.5s linear infinite; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="lf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#238636"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="198" rx="15" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Particles -->
  <circle cx="100" cy="30" r="1.5" fill="#3fb950" opacity="0.4" class="p1"/>
  <circle cx="700" cy="160" r="1" fill="#bc8cff" opacity="0.3" class="p2"/>
  <circle cx="400" cy="100" r="1.5" fill="#58a6ff" opacity="0.3" class="p3"/>

  <!-- Magnifying glass / code review icon -->
  <g transform="translate(80, 52)">
    <!-- Document -->
    <rect x="15" y="0" width="50" height="70" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1.5" class="lens-body"/>
    <!-- Code lines -->
    <line x1="25" y1="15" x2="55" y2="15" stroke="#3fb950" stroke-width="2" opacity="0.6" stroke-dasharray="4 2" class="code-line"/>
    <line x1="25" y1="25" x2="50" y2="25" stroke="#58a6ff" stroke-width="2" opacity="0.5" stroke-dasharray="4 2" class="code-line"/>
    <line x1="25" y1="35" x2="58" y2="35" stroke="#8b949e" stroke-width="2" opacity="0.4" stroke-dasharray="4 2" class="code-line"/>
    <line x1="25" y1="45" x2="45" y2="45" stroke="#ff7b72" stroke-width="2" opacity="0.5" stroke-dasharray="4 2" class="code-line"/>
    <line x1="25" y1="55" x2="52" y2="55" stroke="#3fb950" stroke-width="2" opacity="0.6" stroke-dasharray="4 2" class="code-line"/>
    <!-- Scan line -->
    <rect x="15" y="30" width="50" height="2" rx="1" fill="#3fb950" opacity="0.4" class="scan"/>
    <!-- Magnifying glass overlay -->
    <circle cx="52" cy="52" r="18" fill="none" stroke="url(#lf)" stroke-width="2" opacity="0.7"/>
    <circle cx="52" cy="52" r="18" fill="none" stroke="#3fb950" class="lens-ring"/>
    <line x1="65" y1="65" x2="78" y2="78" stroke="url(#lf)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Check mark in lens -->
    <path d="M44 52 L50 58 L62 46" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Title -->
  <text x="195" y="95" font-family="'SF Mono','Fira Code','JetBrains Mono',Consolas,monospace" font-size="48" font-weight="700" fill="#e6edf3" letter-spacing="-1">fabric-review</text>
  <text x="195" y="128" font-family="'SF Mono','Fira Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#8b949e" letter-spacing="0.5">automated PR review for git-fabric</text>

  <!-- Badges -->
  <g transform="translate(195, 143)">
    <rect x="0" y="0" width="56" height="22" rx="11" fill="#238636" opacity="0.15" stroke="#3fb950" stroke-width="0.5"/>
    <text x="28" y="15" font-family="'SF Mono',Consolas,monospace" font-size="10" fill="#3fb950" text-anchor="middle">MCP</text>
    <rect x="66" y="0" width="86" height="22" rx="11" fill="#238636" opacity="0.15" stroke="#3fb950" stroke-width="0.5"/>
    <text x="109" y="15" font-family="'SF Mono',Consolas,monospace" font-size="10" fill="#3fb950" text-anchor="middle">Code Review</text>
    <rect x="162" y="0" width="56" height="22" rx="11" fill="#58a6ff" opacity="0.15" stroke="#58a6ff" stroke-width="0.5"/>
    <text x="190" y="15" font-family="'SF Mono',Consolas,monospace" font-size="10" fill="#58a6ff" text-anchor="middle">CVE</text>
    <rect x="228" y="0" width="72" height="22" rx="11" fill="#bc8cff" opacity="0.15" stroke="#bc8cff" stroke-width="0.5"/>
    <text x="264" y="15" font-family="'SF Mono',Consolas,monospace" font-size="10" fill="#bc8cff" text-anchor="middle">Security</text>
  </g>

  <!-- Right side checklist -->
  <g transform="translate(680, 35)" opacity="0.35">
    <line x1="30" y1="0" x2="30" y2="120" stroke="#30363d" stroke-width="1"/>
    <!-- Check items -->
    <g class="c1">
      <circle cx="30" cy="20" r="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <path d="M27 20 L29 22 L33 18" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="42" y="24" font-family="'SF Mono',Consolas,monospace" font-size="9" fill="#3fb950" opacity="0.7">diff</text>

    <g class="c2">
      <circle cx="30" cy="50" r="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <path d="M27 50 L29 52 L33 48" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="42" y="54" font-family="'SF Mono',Consolas,monospace" font-size="9" fill="#58a6ff" opacity="0.7">deps</text>

    <g class="c3">
      <circle cx="30" cy="80" r="6" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
      <path d="M27 80 L29 82 L33 78" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="42" y="84" font-family="'SF Mono',Consolas,monospace" font-size="9" fill="#ff7b72" opacity="0.7">vuln</text>

    <g class="c4">
      <circle cx="30" cy="110" r="6" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
      <path d="M27 110 L29 112 L33 108" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="42" y="114" font-family="'SF Mono',Consolas,monospace" font-size="9" fill="#f0883e" opacity="0.7">quality</text>
  </g>
</svg>
